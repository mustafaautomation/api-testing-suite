name: API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: read

jobs:
  test:
    name: API Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run all API tests
        run: npm run test:ci
        env:
          BASE_URL: ${{ vars.BASE_URL || 'https://dummyjson.com' }}
          TEST_USERNAME: ${{ vars.TEST_USERNAME || 'emilys' }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report-${{ github.run_id }}
          path: reports/
          retention-days: 30
